<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valentine ❤️</title>
<style>
body{margin:0;font-family:'Comic Sans MS';background:#ffd6e6;text-align:center}
.page{display:none;padding:20px}
.active{display:block}
button{padding:12px 24px;border-radius:30px;border:none;background:#ff4d6d;color:#fff;font-size:16px}
img{width:200px;margin:15px}
.heart{position:fixed;top:-20px;animation:fall 5s linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
</style>
</head>
<body>

<audio src="music/romantic.mp3" autoplay loop></audio>

<div class="page active" id="p0">
<h2>Will you be my Valentine? 💖</h2>
<img src="gifs/placeholder.gif">
<br>
<button onclick="go(1)">Yes</button>
</div>

<div class="page" id="p1">
<h2>I knew you'd say YES ❤️</h2>
<p>LOVE PASS</p>
<button onclick="go(2)">Next</button>
</div>

<div class="page" id="p2">
<h2>Valentine Week 💕</h2>
<p>9 cute cards (GIF ready)</p>
<button onclick="go(3)">Next</button>
</div>

<div class="page" id="p3">
<h2>My Letter For You 💌</h2>
<p>Loving you is the best thing that ever happened to me.</p>
<button onclick="go(4)">See our memories 📸</button>
</div>

<div class="page" id="p4">
<h2>Our Memories 💗</h2>
<button onclick="go(5)">Forever Us ♾️</button>
</div>

<div class="page" id="p5">
<h2>♾️ I Choose You, Always ♾️</h2>
</div>

<script>
function go(n){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('p'+n).classList.add('active');
}
setInterval(()=>{
let h=document.createElement('div');
h.innerHTML='💖';
h.className='heart';
h.style.left=Math.random()*100+'vw';
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
},300);
</script>

</body>
</html>
