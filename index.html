<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(#f9c5d1,#fddde6);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Comic Sans MS',cursive;
}
.card{
  width:340px;
  background:white;
  border-radius:24px;
  padding:22px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
  animation:fade .4s ease;
  position:relative;
}
h2{margin:10px 0}
p{color:#555;line-height:1.4}
button{
  background:#ff4d6d;
  color:white;
  border:none;
  padding:12px 24px;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  margin:6px;
}
button:hover{transform:scale(1.08)}
.no{
  background:white;
  color:#ff4d6d;
  border:2px solid #ff4d6d;
  position:absolute;
}
.box{
  background:#ffe6ee;
  border-radius:16px;
  padding:20px;
  margin:8px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.memory{
  background:#ffd6e0;
  height:70px;
  border-radius:12px;
  display:none;
}
@keyframes fade{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}
</style>
</head>

<body>

<div class="card" id="card"></div>

<script>
let step = 0;
let noCount = 0;
const noTexts = [
  "Are you sure? 🥺",
  "Think again 😭",
  "Don't break my heart 💔",
  "Pleaseee 🥹",
  "You have no escape 😈"
];

function render(html){
  card.innerHTML = html;
}

function next(){
  step++;
  flow();
}

function flow(){

/* 1 — WILL YOU BE MY VALENTINE */
if(step === 0){
  render(`
    <h2>Will you be my Valentine? 💖</h2>
    <p>I have something special for you…</p>
    <button onclick="yes()">Yes 💕</button>
    <button class="no" id="noBtn">No 🙈</button>
  `);
  moveNo();
}

/* 2 — I KNEW YOU’D SAY YES + LOVE PASS */
if(step === 1){
  render(`
    <h2>I know you would say YES ❤️</h2>
    <div class="box">
      <h3>LOVE PASS 💘</h3>
      <p><b>Name:</b> Suraj</p>
      <p><b>Date:</b> Feb 14</p>
      <p><b>Destination:</b> ∞ Forever</p>
      <p><b>Seat:</b> My Heart ❤️</p>
    </div>
    <button onclick="next()">Next 💞</button>
  `);
}

/* 3 — VALENTINE WEEK */
if(step === 2){
  render(`
    <h2>Valentine Week 💗</h2>
    <div class="box">🌹 Rose Day</div>
    <div class="box">🤗 Hug Day</div>
    <div class="box">🍫 Chocolate Day</div>
    <div class="box">🧸 Teddy Day</div>
    <div class="box">💍 Promise Day</div>
    <div class="box">💋 Kiss Day</div>
    <button onclick="next()">Next 💞</button>
  `);
}

/* 4 — LETTER */
if(step === 3){
  render(`
    <h2>My Letter For You 💌</h2>
    <p><b>My Love ❤️</b></p>
    <p>
      Loving you is the best thing that ever happened to me.<br><br>
      You make my normal days special and my bad days better.<br><br>
      I promise to choose you — today, tomorrow and forever.
    </p>
    <p><b>Forever Yours,<br>Jaanu</b></p>
    <button onclick="next()">See our memories 📸</button>
  `);
}

/* 5 — MEMORIES */
if(step === 4){
  render(`
    <h2>Our Memories 💗</h2>
    <div class="grid">
      ${Array(9).fill(0).map(()=>`<div class="memory"></div>`).join("")}
    </div>
    <button onclick="next()">Forever Us ♾️</button>
  `);
  revealMemories();
}

/* 6 — FOREVER PAGE */
if(step === 5){
  render(`
    <h2>♾️ I Choose You, Always ♾️</h2>
    <p>This is forever. This is us.</p>
  `);
}

}

function yes(){
  step = 1;
  flow();
}

function moveNo(){
  const btn = document.getElementById("noBtn");
  btn.onmouseover = () => {
    noCount++;
    btn.innerText = noTexts[Math.min(noCount,noTexts.length-1)];
    btn.style.left = Math.random()*200 + "px";
    btn.style.top = Math.random()*200 + "px";
  };
}

function revealMemories(){
  const mem = document.querySelectorAll(".memory");
  let i = 0;
  const interval = setInterval(()=>{
    if(i >= mem.length){ clearInterval(interval); return; }
    mem[i].style.display="block";
    i++;
  },250);
}

flow();
</script>

</body>
</html>
